<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generator Link Tamu — IVORY SPIRAL BINDER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ivory:#F8F4EA; --cream:#E9DFC9; --gold:#C6A66B; --gold-dark:#9B7C44; --taupe:#85765F; --charcoal:#38352F; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Plus Jakarta Sans', sans-serif; background:#EFE8D8; color:var(--charcoal); padding:16px; min-height:100vh; }
    .card { max-width:580px; margin:16px auto; background:var(--ivory); border:1px solid var(--gold); border-radius:14px; padding:20px; box-shadow:0 10px 28px rgba(56,53,47,0.12); }
    h1 { font-family:'Cormorant Garamond', serif; font-size:1.6rem; margin-bottom:4px; }
    .sub { font-size:0.82rem; color:var(--taupe); margin-bottom:14px; }
    .fg { margin-bottom:12px; }
    .fg label { display:block; font-size:0.76rem; font-weight:600; color:var(--taupe); margin-bottom:4px; }
    .fg input, .fg textarea { width:100%; padding:10px 12px; border:1px solid rgba(198,166,107,0.75); border-radius:8px; background:#FFFDF9; font-family:inherit; font-size:0.86rem; color:var(--charcoal); }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .btn { flex:1; min-width:140px; padding:10px 14px; border-radius:8px; border:1px solid var(--gold-dark); background:var(--charcoal); color:var(--ivory); font-weight:600; font-size:0.82rem; cursor:pointer; text-align:center; text-decoration:none; }
    .btn-gold { background:linear-gradient(135deg,#D2B47C,var(--gold-dark)); color:#fff; }
    .btn-outline { background:var(--ivory); color:var(--charcoal); }
    .preview-box { margin-top:10px; padding:12px; border-radius:8px; background:var(--cream); font-size:0.8rem; word-break:break-all; }
    .contact-note { font-size:0.74rem; color:var(--taupe); margin-top:6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Generator Link Tamu</h1>
    <p class="sub">Pilih kontak dari HP atau ketik nama tamu untuk membuat undangan WhatsApp Islami yang sopan.</p>

    <div class="fg">
      <button id="btn-pick-contact" type="button" class="btn btn-gold" style="width:100%;">Pilih dari Kontak HP (Android)</button>
      <div id="contact-status" class="contact-note"></div>
    </div>

    <div class="fg">
      <label for="base-url">URL Undangan Anda</label>
      <input id="base-url" type="url" />
    </div>
    <div class="fg">
      <label for="guest-name">Nama Tamu yang Diundang</label>
      <input id="guest-name" type="text" placeholder="Contoh: Bpk. Ahmad Fauzi &amp; Keluarga" />
    </div>
    <div class="fg">
      <label for="wa-phone">Nomor WhatsApp Tamu (opsional, format 628xxx)</label>
      <input id="wa-phone" type="text" placeholder="Otomatis terisi dari Kontak atau ketik manual" />
    </div>
    <div class="fg">
      <label for="wa-template">Teks Undangan WhatsApp (bisa diubah sesuai kebutuhan)</label>
      <textarea id="wa-template" rows="10"></textarea>
    </div>

    <div class="preview-box" id="link-preview">Masukkan nama tamu untuk melihat link personal...</div>

    <div class="row">
      <button id="btn-copy-link" type="button" class="btn btn-outline">Salin Link</button>
      <button id="btn-copy-msg" type="button" class="btn btn-outline">Salin Teks Lengkap</button>
      <a id="btn-open-link" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-outline">Pratinjau</a>
    </div>
    <div class="row">
      <a id="btn-send-wa" href="#" target="_blank" rel="noopener noreferrer" class="btn">Kirim via WhatsApp</a>
    </div>
  </div>

  <script>
    (function () {
      var baseEl = document.getElementById('base-url');
      var nameEl = document.getElementById('guest-name');
      var phoneEl = document.getElementById('wa-phone');
      var tplEl = document.getElementById('wa-template');
      var previewEl = document.getElementById('link-preview');
      var openEl = document.getElementById('btn-open-link');
      var waEl = document.getElementById('btn-send-wa');
      var copyBtn = document.getElementById('btn-copy-link');
      var copyMsgBtn = document.getElementById('btn-copy-msg');
      var pickBtn = document.getElementById('btn-pick-contact');
      var contactStatus = document.getElementById('contact-status');

      var DEFAULT_TEMPLATE =
        'Bismillahirrahmanirrahim.\n' +
        'Assalamu\'alaikum Warahmatullahi Wabarakatuh.\n\n' +
        'Kepada Yth. {NAMA_TAMU},\n\n' +
        'Dengan memohon rahmat dan ridha Allah SWT, tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan putra-putri kami:\n\n' +
        '*Saepudin Hidayatullah & Khodijah*\n' +
        'Hari/Tanggal: Kamis, 31 Desember 2026\n\n' +
        'Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir serta memberikan doa restu.\n\n' +
        'Informasi lengkap dan undangan digital dapat dibuka melalui tautan berikut:\n' +
        '{LINK}\n\n' +
        'Atas perhatian dan doa restunya, kami ucapkan terima kasih.\n' +
        'Wassalamu\'alaikum Warahmatullahi Wabarakatuh.';

      baseEl.value = window.location.origin + '/';
      tplEl.value = DEFAULT_TEMPLATE;

      function normalizePhone(raw) {
        var digits = String(raw || '').replace(/[^0-9]/g, '');
        if (digits.startsWith('0')) digits = '62' + digits.slice(1);
        return digits;
      }

      function buildMessage() {
        var base = baseEl.value.trim().replace(/\/+$/, '') + '/';
        var name = nameEl.value.trim();
        var url = name ? base + '?to=' + encodeURIComponent(name).replace(/%20/g, '+') : base;
        var sapaan = name || 'Bapak/Ibu/Saudara/i';
        var text = tplEl.value.replace(/\{NAMA_TAMU\}/g, sapaan).replace(/\{LINK\}/g, url);
        return { url: url, text: text };
      }

      function update() {
        var res = buildMessage();
        previewEl.textContent = res.url;
        openEl.href = res.url;
        var phone = normalizePhone(phoneEl.value);
        waEl.href = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(res.text);
      }

      pickBtn.addEventListener('click', async function () {
        if (!('contacts' in navigator) || !('ContactsManager' in window)) {
          contactStatus.textContent = 'Browser perangkat ini belum mendukung baca kontak otomatis (tersedia di Chrome Android). Silakan ketik nama tamu secara manual atau pilih kontak langsung di WhatsApp.';
          return;
        }
        try {
          var selected = await navigator.contacts.select(['name', 'tel'], { multiple: false });
          if (selected && selected.length) {
            var c = selected[0];
            if (c.name && c.name.length) nameEl.value = c.name[0];
            if (c.tel && c.tel.length) phoneEl.value = normalizePhone(c.tel[0]);
            contactStatus.textContent = 'Kontak berhasil dimuat.';
            update();
          }
        } catch (err) {
          contactStatus.textContent = 'Pemilihan kontak dibatalkan.';
        }
      });

      baseEl.addEventListener('input', update);
      nameEl.addEventListener('input', update);
      phoneEl.addEventListener('input', update);
      tplEl.addEventListener('input', update);

      copyBtn.addEventListener('click', function () {
        var url = buildMessage().url;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(function () {
            copyBtn.textContent = 'Link Tersalin!';
            setTimeout(function () { copyBtn.textContent = 'Salin Link'; }, 1800);
          });
        }
      });

      copyMsgBtn.addEventListener('click', function () {
        var msg = buildMessage().text;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(msg).then(function () {
            copyMsgBtn.textContent = 'Teks Tersalin!';
            setTimeout(function () { copyMsgBtn.textContent = 'Salin Teks Lengkap'; }, 1800);
          });
        }
      });

      update();
    })();
  </script>
</body>
</html>
